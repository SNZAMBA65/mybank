# .github/workflows/ci-cd.yml

# Nom du workflow (il apparaîtra dans GitHub Actions)
name: MyBank CI/CD Pipeline

# Déclencheurs : le pipeline s'exécute quand...
on:
  push:               # → lors d'un push sur les branches listées
    branches: [ main, master, develop ]
  pull_request:       # → lors d'une Pull Request vers ces branches
    branches: [ main, master ]

jobs:
  # ================================
  # 1. Tests Backend Symfony
  # ================================
  backend-tests:
    runs-on: ubuntu-latest   # Le job tourne sur un runner Ubuntu fourni par GitHub
    services:                # On démarre un service MySQL pour les tests
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mybank_test
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306        # Expose MySQL pour Symfony

    steps:
    - name: Checkout code
      uses: actions/checkout@v4   # Récupère le code de ton repo

    - name: Setup PHP
      uses: shivammathur/setup-php@v2   # Installe PHP
      with:
        php-version: '8.2'
        extensions: mbstring, xml, pdo_mysql  # Extensions nécessaires pour Symfony

    - name: Cache Composer packages
      uses: actions/cache@v3
      with:
        path: vendor                     # Cache du dossier vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      working-directory: ./Backend
      run: composer install --prefer-dist --no-progress   # Installe les dépendances PHP

    - name: Run database migrations
      working-directory: ./Backend
      run: |
        cp .env.test .env.local   # Configure l'environnement de test
        php bin/console doctrine:database:create --env=test
        php bin/console doctrine:migrations:migrate --no-interaction --env=test

    - name: Run PHPUnit tests
      working-directory: ./Backend
      run: php bin/phpunit       # Lance les tests PHP

  # ================================
  # 2. Tests Frontend React
  # ================================
  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'               # Version de Node
        cache: 'npm'
        cache-dependency-path: Frontend/package-lock.json

    - name: Install dependencies
      working-directory: ./Frontend
      run: npm ci                        # Installe les dépendances JS

    - name: Run ESLint
      working-directory: ./Frontend
      run: npm run lint                  # Vérifie le style de code

    - name: Run tests
      working-directory: ./Frontend
      run: npm test                      # Lance les tests React

    - name: Build application
      working-directory: ./Frontend
      run: npm run build                 # Vérifie que le frontend compile

  # ================================
  # 3. Tests d'intégration
  # ================================
  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]  # Ce job ne démarre que si les deux premiers passent

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build Docker images
      run: |
        docker-compose build
        docker-compose up -d            # Démarre tes services en containers

    - name: Wait for services
      run: |
        sleep 30                        # Attente (pas toujours suffisant)
        docker-compose ps

    - name: Run integration tests
      run: |
        # Vérifie que l’API backend répond
        curl -f http://localhost:8000/api/health || exit 1
        
        # Vérifie que le frontend répond
        curl -f http://localhost:5173 || exit 1

    - name: Cleanup
      run: docker-compose down          # Stoppe les containers

  # ================================
  # 4. Déploiement (seulement sur main)
  # ================================
  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Ce job ne tourne QUE si on pousse sur main

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build and push Docker images
      run: |
        echo "Building production images..."
        docker-compose -f docker-compose.prod.yml build
        # Ici tu pourrais push vers DockerHub/registry

    - name: Deploy to production
      run: |
        echo "Deploying to production server..."
        # Ici tu mettrais ton script de déploiement (ssh, rsync, etc.)
