services:
  database:
    image: mysql:8.0
    container_name: mybank_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password   # mot de passe root
      MYSQL_DATABASE: mybank              # nom de la base
      MYSQL_USER: mybank_user             # utilisateur
      MYSQL_PASSWORD: mybank_password     # mot de passe utilisateur
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mybank_backend
    ports:
      - "8000:9000"
    volumes:
      - ./backend:/var/www/html
    environment:
      DATABASE_URL: mysql://mybank_user:mybank_password@database:3306/mybank
    depends_on:
      - database

  frontend:
    build:
      context: ./Frontend   # ⚡ ajoute bien un Dockerfile dans ./Frontend
    container_name: mybank_frontend
    ports:
      - "3000:3000"

volumes:
  db_data:
